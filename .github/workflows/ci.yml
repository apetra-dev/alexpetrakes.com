name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Django checks and tests
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-not-a-real-secret
      DEBUG: "False"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: System check
        run: python manage.py check

      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      - name: Migrate
        run: python manage.py migrate --noinput

      - name: Tests
        run: python manage.py test --noinput --verbosity 2

      - name: Static files collect cleanly
        run: python manage.py collectstatic --noinput

  deploy:
    name: Deploy to Render
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: render-deploy
      cancel-in-progress: false
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - name: Trigger deploy
        run: |
          set -euo pipefail
          http=$(curl -sS -o /tmp/trigger.json -w '%{http_code}' -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}')
          echo "Render responded HTTP ${http} for ${GITHUB_SHA}"
          cat /tmp/trigger.json 2>/dev/null || true; echo
          case "$http" in
            2*) ;;
            *) echo "Deploy trigger failed"; exit 1 ;;
          esac

      - name: Wait for the deploy of this commit to go live
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            result=$(curl -fsS "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys?limit=10" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" | python3 -c '
          import json, os, sys
          sha = os.environ["GITHUB_SHA"]
          deploys = [item["deploy"] for item in json.load(sys.stdin)]
          mine = [d for d in deploys if (d.get("commit") or {}).get("id") == sha]
          statuses = [d.get("status") for d in mine]
          active = {"created", "queued", "pre_deploy_in_progress", "build_in_progress", "update_in_progress"}
          if "live" in statuses:
              print("live")
          elif any(s in active for s in statuses):
              print("in_progress:" + ",".join(statuses))
          elif not statuses:
              print("not_found")
          else:
              print("failed:" + ",".join(statuses))
          ')
            echo "[$i] ${result}"
            case "$result" in
              live) echo "Deploy is live."; exit 0 ;;
              failed:*) echo "Every deploy of ${GITHUB_SHA} ended in a failed state."; exit 1 ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for ${GITHUB_SHA} to go live"; exit 1
