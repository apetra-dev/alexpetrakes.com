{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Alex Petrakes, full-stack software engineer building data-intensive web applications where correctness is non-negotiable.">
    <title>{% block title %}{{ title|default:"Alex Petrakes" }}{% endblock %}</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'images/favicon-16x16.png' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'images/apple-touch-icon.png' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600&family=Schibsted+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<header class="at-nav" data-nav>
    <div class="at-nav__inner">
        <a href="#home" class="at-brand">Alex Petrakes</a>
        <nav class="at-nav__links" aria-label="Sections">
            <a href="#about" data-section-link>About</a>
            <a href="#projects" data-section-link>Work</a>
            <a href="#contact" data-section-link>Contact</a>
        </nav>
    </div>
</header>

<main class="at-page">
    {% block content %}{% endblock %}
</main>

<footer class="at-footer">
    <div class="at-footer__inner">
        <p>&copy; {% now "Y" %} Alex Petrakes</p>
        <div class="at-footer__links">
            <a href="#about">About</a>
            <a href="#projects">Work</a>
            <a href="#contact">Contact</a>
        </div>
    </div>
</footer>


<script src="{% static 'js/main.js' %}"></script>
</body>
</html>
